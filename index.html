<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Guess the Perfume Brand</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Paho MQTT over Secure WebSockets (Cross-device cloud sync) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-slow {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen selection:bg-amber-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- AUDIO SYNTHESIZER ENGINE ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playUrgentTick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playBuzzer() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }
      playReveal() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.3);
          osc.start(this.ctx.currentTime + idx * 0.07);
          osc.stop(this.ctx.currentTime + idx * 0.07 + 0.3);
        });
      }
      playCheer() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const melody = [440, 554, 659, 880];
        melody.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + idx * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.1 + 0.4);
          osc.start(this.ctx.currentTime + idx * 0.1);
          osc.stop(this.ctx.currentTime + idx * 0.1 + 0.4);
        });
      }
    }
    const sounds = new SoundEngine();

    // --- OFFICIAL BRAND LOGO COMPONENT ---
    const OfficialLogo = ({ className = "h-10", showText = true }) => {
      const [imgFailed, setImgFailed] = useState(false);
      return (
        <div className={`flex items-center gap-3 select-none ${className}`}>
          {!imgFailed ? (
            <img 
              src="Logo Game.png" 
              alt="Game Master Logo" 
              className="h-full object-contain filter drop-shadow" 
              onError={() => setImgFailed(true)} 
            />
          ) : (
            <div className="flex items-center gap-2">
              <svg viewBox="0 0 100 65" className="h-full w-auto fill-none stroke-current" style={{ minWidth: '42px' }}>
                <path d="M 28 20 L 38 7 L 50 17 L 62 7 L 72 20 Z" stroke="#f97316" strokeWidth="3" strokeLinejoin="round" fill="none" />
                <path d="M 46 22 L 72 22 C 84 22, 92 30, 92 42 C 92 54, 82 62, 70 62 L 54 62 C 46 62, 40 56, 38 48" stroke="#f97316" strokeWidth="4" strokeLinecap="round" />
                <circle cx="78" cy="36" r="3.5" fill="#f97316" stroke="none" />
                <circle cx="86" cy="44" r="3.5" fill="#f97316" stroke="none" />
                <circle cx="70" cy="44" r="3.5" fill="#f97316" stroke="none" />
                <circle cx="78" cy="52" r="3.5" fill="#f97316" stroke="none" />
                <path d="M 16 38 L 48 24 L 56 36 L 24 50 Z" stroke="#f97316" strokeWidth="3.5" strokeLinejoin="round" />
                <path d="M 12 52 C 20 52, 28 42, 34 38 C 40 34, 46 36, 50 42 C 44 48, 38 58, 22 62" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" />
              </svg>
              {showText && (
                <div className="flex flex-col leading-none">
                  <span className="text-[10px] tracking-widest text-slate-400 font-semibold uppercase">BY: RJR</span>
                  <div className="flex text-lg font-black tracking-tight">
                    <span className="text-white">GAME</span>
                    <span className="text-amber-500 ml-1">MASTER</span>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // --- PRESET PERFUMES ---
    const DEFAULT_ROUNDS = [
      {
        id: "round-1",
        name: "Prada Paradoxe",
        option1: "Prada",
        option2: "Prada Milano",
        // Clean vector close-up
        guessImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'><rect width='300' height='300' fill='%230f172a'/><polygon points='150,40 270,240 30,240' fill='%23fb7185'/><rect x='130' y='18' width='40' height='24' fill='%231e293b' rx='4'/><text x='150' y='165' fill='white' font-family='sans-serif' font-size='22' font-weight='900' text-anchor='middle' letter-spacing='4'>P R A D A</text></svg>",
        revealImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'><rect width='300' height='300' fill='%23090d16'/><polygon points='150,40 270,240 30,240' fill='%23f43f5e'/><rect x='130' y='18' width='40' height='24' fill='%230f172a' rx='4'/><text x='150' y='165' fill='white' font-family='sans-serif' font-size='22' font-weight='900' text-anchor='middle' letter-spacing='4'>P R A D A</text><text x='150' y='195' fill='%23ffe4e6' font-family='sans-serif' font-size='11' font-weight='700' text-anchor='middle' letter-spacing='3'>PARADOXE</text></svg>"
      },
      {
        id: "round-2",
        name: "1 Million Elixir",
        option1: "Rabanne",
        option2: "Paco Rabanne",
        guessImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'><rect width='300' height='300' fill='%230f172a'/><rect x='70' y='40' width='160' height='220' rx='16' fill='%23d97706'/><text x='150' y='155' fill='white' font-family='sans-serif' font-size='18' font-weight='900' text-anchor='middle'>1 MILLION</text></svg>",
        revealImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300' width='100%' height='100%'><rect width='300' height='300' fill='%23090d16'/><rect x='70' y='30' width='160' height='240' rx='18' fill='%23b45309'/><text x='150' y='150' fill='white' font-family='sans-serif' font-size='20' font-weight='900' text-anchor='middle'>1 MILLION</text><text x='150' y='180' fill='%23fef3c7' font-family='sans-serif' font-size='12' font-weight='700' text-anchor='middle'>ELIXIR</text></svg>"
      }
    ];

    // --- MAIN APPLICATION ---
    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlRole = urlParams.get('role');
      const urlRoom = urlParams.get('room') || 'PERFUME';

      // Current view & room settings
      const [role, setRole] = useState(urlRole === 'contestant' ? 'contestant' : 'gm');
      const [roomCode, setRoomCode] = useState(urlRoom);
      const [showGmLogin, setShowGmLogin] = useState(false);
      const [gmPasscode, setGmPasscode] = useState('');
      const [gmAuthenticated, setGmAuthenticated] = useState(false);
      const [activeTab, setActiveTab] = useState('arena'); // 'arena' | 'items'

      // Contestant local state
      const [playerName, setPlayerName] = useState(() => localStorage.getItem('perfume_player_name') || '');
      const [inputName, setInputName] = useState('');
      const [contestantGuess, setContestantGuess] = useState('');
      const [hasSubmitted, setHasSubmitted] = useState(false);

      // Connection Status
      const [netStatus, setNetStatus] = useState('connecting'); // 'live' | 'connecting' | 'offline'

      // Perfume Items List (Managed by GM)
      const [rounds, setRounds] = useState(() => {
        try {
          const saved = localStorage.getItem('perfume_custom_rounds');
          return saved ? JSON.parse(saved) : DEFAULT_ROUNDS;
        } catch {
          return DEFAULT_ROUNDS;
        }
      });

      // Synchronized Game State
      // RULE: ALWAYS initialize status as 'waiting' to avoid landing on revealed screens!
      const [gameState, setGameState] = useState({
        status: 'waiting', // 'waiting' | 'guessing' | 'revealed' | 'ended'
        roundIndex: 0,
        timer: 10,
        endTime: null,
        players: [],
        sessionUid: Date.now()
      });

      // Local countdown remaining seconds
      const [timeLeft, setTimeLeft] = useState(10);
      const [soundMuted, setSoundMuted] = useState(false);

      // Modal state for Add Item
      const [showAddModal, setShowAddModal] = useState(false);
      const [newItem, setNewItem] = useState({
        name: '',
        option1: '',
        option2: '',
        guessImage: '',
        revealImage: ''
      });

      // Refs for sync loop
      const mqttClientRef = useRef(null);
      const gameStateRef = useRef(gameState);
      gameStateRef.current = gameState;
      const roleRef = useRef(role);
      roleRef.current = role;

      // Clean old stale localStorage on load
      useEffect(() => {
        try {
          localStorage.removeItem('perfume_game_state');
        } catch(e) {}
      }, []);

      // Synchronize SoundEngine mute
      useEffect(() => {
        sounds.muted = soundMuted;
      }, [soundMuted]);

      // --- MQTT REAL-TIME ENGINE (CROSS-DEVICE) ---
      useEffect(() => {
        const topic = `giv-perfume-game-v3/${roomCode}`;
        const clientId = `client_${Math.random().toString(16).substr(2, 8)}`;
        
        // Primary: HiveMQ over SSL; fallback: EMQX
        const brokerHost = 'broker.hivemq.com';
        const brokerPort = 8884;

        if (window.Paho && window.Paho.MQTT) {
          const client = new window.Paho.MQTT.Client(brokerHost, brokerPort, '/mqtt', clientId);
          mqttClientRef.current = client;

          client.onConnectionLost = (responseObject) => {
            setNetStatus('connecting');
            setTimeout(() => {
              try { client.connect(connectOptions); } catch(e){}
            }, 3000);
          };

          client.onMessageArrived = (message) => {
            try {
              const data = JSON.parse(message.payloadString);
              if (data.senderId === clientId) return; // Ignore local echoes

              if (data.type === 'STATE_UPDATE') {
                setGameState(prev => {
                  // If timer just started
                  if (prev.status === 'waiting' && data.state.status === 'guessing') {
                    sounds.playTick();
                    setHasSubmitted(false);
                    setContestantGuess('');
                  }
                  if (data.state.status === 'revealed' && prev.status !== 'revealed') {
                    sounds.playReveal();
                  }
                  return { ...prev, ...data.state };
                });
              } else if (data.type === 'PLAYER_JOIN') {
                if (roleRef.current === 'gm') {
                  setGameState(prev => {
                    const exists = prev.players.find(p => p.id === data.player.id || p.name.toLowerCase() === data.player.name.toLowerCase());
                    let newPlayers;
                    if (exists) {
                      newPlayers = prev.players.map(p => (p.id === data.player.id || p.name.toLowerCase() === data.player.name.toLowerCase()) ? { ...p, id: data.player.id, active: true } : p);
                    } else {
                      newPlayers = [...prev.players, { ...data.player, score: 0, currentGuess: '', isCorrect: null }];
                    }
                    const updated = { ...prev, players: newPlayers };
                    broadcastState(updated);
                    return updated;
                  });
                }
              } else if (data.type === 'PLAYER_SUBMIT') {
                if (roleRef.current === 'gm') {
                  setGameState(prev => {
                    const updatedPlayers = prev.players.map(p => {
                      if (p.name.toLowerCase() === data.playerName.toLowerCase()) {
                        return { ...p, currentGuess: data.guess };
                      }
                      return p;
                    });
                    const updated = { ...prev, players: updatedPlayers };
                    broadcastState(updated);
                    return updated;
                  });
                }
              } else if (data.type === 'GAME_RESET') {
                // Game Master reset: clear names & return contestants to home
                localStorage.removeItem('perfume_player_name');
                setPlayerName('');
                setContestantGuess('');
                setHasSubmitted(false);
                setGameState(prev => ({
                  ...prev,
                  status: 'waiting',
                  roundIndex: 0,
                  players: []
                }));
              }
            } catch (err) {
              console.error("MQTT message parse error:", err);
            }
          };

          const connectOptions = {
            useSSL: true,
            timeout: 5,
            keepAliveInterval: 30,
            cleanSession: true,
            onSuccess: () => {
              setNetStatus('live');
              client.subscribe(topic, { qos: 0 });
              // If joining as contestant with a name, announce presence immediately
              const currentName = localStorage.getItem('perfume_player_name');
              if (currentName) {
                publishMessage({
                  type: 'PLAYER_JOIN',
                  player: { id: clientId, name: currentName }
                });
              }
            },
            onFailure: () => {
              setNetStatus('offline');
            }
          };

          try {
            client.connect(connectOptions);
          } catch(e) {
            setNetStatus('offline');
          }

          return () => {
            try { client.disconnect(); } catch(e){}
          };
        }
      }, [roomCode]);

      // Publish helper
      const publishMessage = (payload) => {
        if (mqttClientRef.current && mqttClientRef.current.isConnected()) {
          const message = new window.Paho.MQTT.Message(JSON.stringify({
            ...payload,
            senderId: mqttClientRef.current.clientId
          }));
          message.destinationName = `giv-perfume-game-v3/${roomCode}`;
          message.retained = false;
          mqttClientRef.current.send(message);
        }
      };

      const broadcastState = (newState) => {
        publishMessage({
          type: 'STATE_UPDATE',
          state: newState
        });
      };

      // Periodic Game Master Pulse (Every 2.5s) to sync new players seamlessly
      useEffect(() => {
        if (role !== 'gm') return;
        const interval = setInterval(() => {
          broadcastState(gameStateRef.current);
        }, 2500);
        return () => clearInterval(interval);
      }, [role]);

      // --- LOCAL TIMER SYNCHRONIZATION ---
      useEffect(() => {
        let timerId;
        if (gameState.status === 'guessing' && gameState.endTime) {
          timerId = setInterval(() => {
            const diff = Math.max(0, Math.ceil((gameState.endTime - Date.now()) / 1000));
            setTimeLeft(diff);
            
            if (diff <= 3 && diff > 0) {
              sounds.playUrgentTick();
            } else if (diff > 3) {
              sounds.playTick();
            }

            if (diff <= 0) {
              clearInterval(timerId);
              sounds.playBuzzer();
              if (roleRef.current === 'gm') {
                // Timer finished: transition automatically to locked
                handleRevealAnswer();
              }
            }
          }, 250);
        } else {
          setTimeLeft(10);
        }
        return () => clearInterval(timerId);
      }, [gameState.status, gameState.endTime]);

      // Current active round object
      const currentRound = rounds[gameState.roundIndex] || rounds[0] || DEFAULT_ROUNDS[0];

      // --- GAME MASTER ACTIONS ---
      const handleStartTimer = () => {
        sounds.init();
        sounds.playTick();
        const duration = 10;
        const endTime = Date.now() + duration * 1000;
        
        // Reset players round guess statuses
        const resetPlayers = gameState.players.map(p => ({
          ...p,
          currentGuess: '',
          isCorrect: null
        }));

        const next = {
          ...gameState,
          status: 'guessing',
          timer: duration,
          endTime: endTime,
          players: resetPlayers
        };
        setGameState(next);
        broadcastState(next);
      };

      const handleRevealAnswer = () => {
        sounds.playReveal();

        // Calculate auto results
        const opt1 = (currentRound.option1 || '').trim().toLowerCase();
        const opt2 = (currentRound.option2 || '').trim().toLowerCase();
        const allowOpt2 = opt2 && opt2 !== 'n/a' && opt2 !== 'na';

        const evaluatedPlayers = gameState.players.map(player => {
          const guess = (player.currentGuess || '').trim().toLowerCase();
          let isCorrect = false;
          if (guess.length > 0) {
            if (guess === opt1 || (allowOpt2 && guess === opt2)) {
              isCorrect = true;
            } else if (opt1.includes(guess) && guess.length >= 3) {
              isCorrect = true;
            }
          }
          return {
            ...player,
            isCorrect: isCorrect,
            score: isCorrect ? player.score + 1 : player.score
          };
        });

        const next = {
          ...gameState,
          status: 'revealed',
          players: evaluatedPlayers
        };
        setGameState(next);
        broadcastState(next);
      };

      const handleNextRound = () => {
        const nextIndex = (gameState.roundIndex + 1) % rounds.length;
        const next = {
          ...gameState,
          status: 'waiting', // Returns everyone to the clean waiting lobby!
          roundIndex: nextIndex,
          timer: 10,
          endTime: null
        };
        setGameState(next);
        broadcastState(next);
      };

      const handleForceResetLobby = () => {
        // Forces all devices back to waiting lobby
        const next = {
          ...gameState,
          status: 'waiting',
          endTime: null,
          timer: 10
        };
        setGameState(next);
        broadcastState(next);
      };

      const handleRestartGame = () => {
        if (!confirm("Are you sure? This will reset all scores, clear players, and return contestants to the home screen.")) return;
        const next = {
          status: 'waiting',
          roundIndex: 0,
          timer: 10,
          endTime: null,
          players: [],
          sessionUid: Date.now()
        };
        setGameState(next);
        publishMessage({ type: 'GAME_RESET' });
        broadcastState(next);
      };

      const handleScoreAdjust = (playerName, delta) => {
        setGameState(prev => {
          const updated = {
            ...prev,
            players: prev.players.map(p => p.name === playerName ? { ...p, score: Math.max(0, p.score + delta) } : p)
          };
          broadcastState(updated);
          return updated;
        });
      };

      // --- CONTESTANT ACTIONS ---
      const handleRegisterName = (e) => {
        e.preventDefault();
        const trimmed = inputName.trim();
        if (!trimmed) return;
        localStorage.setItem('perfume_player_name', trimmed);
        setPlayerName(trimmed);
        publishMessage({
          type: 'PLAYER_JOIN',
          player: { id: `player_${Date.now()}`, name: trimmed }
        });
      };

      const handleSubmitGuess = (e) => {
        e.preventDefault();
        if (!contestantGuess.trim() || hasSubmitted) return;
        sounds.playTick();
        setHasSubmitted(true);
        publishMessage({
          type: 'PLAYER_SUBMIT',
          playerName: playerName,
          guess: contestantGuess.trim()
        });
      };

      // Top Leader calculation for contestant banner (Anonymous: "Player No.1 (3p)")
      const anonymousLeader = useMemo(() => {
        if (!gameState.players || gameState.players.length === 0) return "No scores yet";
        const sorted = [...gameState.players].sort((a,b) => b.score - a.score);
        if (sorted[0].score === 0) return "No points yet";
        return `Player No.1 (${sorted[0].score}p)`;
      }, [gameState.players]);

      const myPlayerData = useMemo(() => {
        return gameState.players.find(p => p.name.toLowerCase() === playerName.toLowerCase()) || { score: 0 };
      }, [gameState.players, playerName]);

      // --- RENDER CONTESTANT VIEW ---
      if (role === 'contestant') {
        // Step 1: If name is not yet entered, display Name Entry Screen
        if (!playerName) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-slate-950">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-6">
                <div className="flex justify-center">
                  <OfficialLogo className="h-14" />
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-white tracking-tight">Join Perfume Game</h1>
                  <p className="text-slate-400 text-sm mt-1">Room: <span className="text-amber-400 font-mono font-bold">{roomCode}</span></p>
                </div>
                <form onSubmit={handleRegisterName} className="space-y-4">
                  <input
                    type="text"
                    required
                    placeholder="Enter your nickname..."
                    value={inputName}
                    onChange={(e) => setInputName(e.target.value)}
                    className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 text-center font-bold text-lg"
                  />
                  <button
                    type="submit"
                    className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-black rounded-xl shadow-lg transition active:scale-95"
                  >
                    Enter Game Arena ➔
                  </button>
                </form>
                <div className="pt-2">
                  <button

                <div>
                  <h2 className="text-xl font-black text-white">Perfume Items Inventory</h2>
                  <p className="text-slate-400 text-xs">Configure fragrances, accepted alternative brand answers, and bottle photos.</p>
                </div>
                <button
                  onClick={() => setShowAddModal(true)}
                  className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-xs shadow-lg transition"
                >
                  + Add New Perfume
                </button>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {rounds.map((item, idx) => (
                  <div key={item.id || idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 relative">
                    <div className="flex items-center justify-between">
                      <span className="text-[10px] font-bold text-amber-400 uppercase tracking-widest">Item #{idx + 1}</span>
                      <button
                        onClick={() => {
                          if (rounds.length <= 1) return alert("Must keep at least 1 item!");
                          const updated = rounds.filter((_, i) => i !== idx);
                          setRounds(updated);
                          localStorage.setItem('perfume_custom_rounds', JSON.stringify(updated));
                        }}
                        className="text-xs text-rose-400 hover:text-rose-300"
                      >
                        Delete
                      </button>
                    </div>

                    <div className="aspect-video bg-slate-950 rounded-xl overflow-hidden flex items-center justify-center p-2 border border-slate-800">
                      {item.guessImage ? (
                        <img src={item.guessImage} alt={item.name} className="w-full h-full object-contain" />
                      ) : (
                        <span className="text-slate-600 text-xs">No image</span>
                      )}
                    </div>

                    <div>
                      <h4 className="font-bold text-sm text-white">{item.name}</h4>
                      <p className="text-xs text-slate-400">Option 1: <strong className="text-slate-200">{item.option1}</strong></p>
                      {item.option2 && item.option2 !== 'N/A' && (
                        <p className="text-xs text-slate-400">Option 2: <strong className="text-slate-200">{item.option2}</strong></p>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* ADD ITEM MODAL */}
          {showAddModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 className="font-bold text-white">Add New Perfume Item</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Perfume Name (Internal Title)</label>
                    <input
                      type="text"
                      placeholder="e.g. Dior Sauvage"
                      value={newItem.name}
                      onChange={(e) => setNewItem({ ...newItem, name: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-medium focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Answer Option 1 (Primary Brand)*</label>
                    <input
                      type="text"
                      placeholder="e.g. Dior"
                      value={newItem.option1}
                      onChange={(e) => setNewItem({ ...newItem, option1: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-medium focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Answer Option 2 (Alternative / Optional)</label>
                    <input
                      type="text"
                      placeholder="e.g. Christian Dior (or leave blank / N/A)"
                      value={newItem.option2}
                      onChange={(e) => setNewItem({ ...newItem, option2: e.target.value })}
                      className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-white font-medium focus:border-amber-500"
                    />
                  </div>

                  <div>
                    <label className="text-slate-400 font-bold block mb-1">Close-Up Guessing Image URL or File</label>
                    <input
                      type="file"
                      accept="image/*"
                      onChange={(e) => {
                        const file = e.target.files[0];
                        if (file) {
                          const reader = new FileReader();
                          reader.onload = () => setNewItem(prev => ({ ...prev, guessImage: reader.result }));
                          reader.readAsDataURL(file);
                        }
                      }}
                      className="block w-full text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-lg file:border-0 file:bg-slate-800 file:text-xs file:font-bold file:text-amber-400 mb-1"
                    />
                    <input
                      type="text"
                      placeholder="Or paste image URL (https://...)"
                      value={newItem.guessImage}
                      onChange={(e) => setNewItem({ ...newItem, guessImage: e.target.value })}
                      className="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono text-[11px]"
                    />
                  </div>
                </div>

                <div className="flex items-center justify-end gap-2 pt-3 border-t border-slate-800">
                  <button
                    onClick={() => setShowAddModal(false)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-xl text-xs font-bold"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      if (!newItem.option1) return alert("Option 1 (Brand) is required!");
                      const updated = [...rounds, {
                        ...newItem,
                        id: `item_${Date.now()}`,
                        name: newItem.name || newItem.option1
                      }];
                      setRounds(updated);
                      localStorage.setItem('perfume_custom_rounds', JSON.stringify(updated));
                      setShowAddModal(false);
                      setNewItem({ name: '', option1: '', option2: '', guessImage: '', revealImage: '' });
                    }}
                    className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 rounded-xl text-xs font-black shadow"
                  >
                    Save Perfume
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React App
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
