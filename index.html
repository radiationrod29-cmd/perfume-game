<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Guess the Perfume Brand</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM 18 -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Paho MQTT WebSockets for cross-device synchronization -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>

  <style>
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .animate-pulse-slow {
      animation: pulse-ring 2.5s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-[#0b0f17] text-slate-100 min-h-screen selection:bg-amber-500 selection:text-black">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- SOUND ENGINE ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.05);
      }
      playUrgentTick() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(880, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      playBuzzer() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.35);
      }
      playReveal() {
        if (this.muted) return;
        this.init();
        if (!this.ctx) return;
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.07);
          gain.gain.setValueAtTime(0.1, this.ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.07 + 0.3);
          osc.start(this.ctx.currentTime + idx * 0.07);
          osc.stop(this.ctx.currentTime + idx * 0.07 + 0.3);
        });
      }
    }
    const sounds = new SoundEngine();

    // --- OFFICIAL BRAND LOGO ---
    const OfficialLogo = ({ className = "h-8", showText = true }) => {
      const [imgFailed, setImgFailed] = useState(false);
      return (
        <div className={`flex items-center gap-2.5 select-none ${className}`}>
          {!imgFailed ? (
            <img 
              src="Logo Game.png" 
              alt="Game Master Logo" 
              className="h-full object-contain filter drop-shadow" 
              onError={() => setImgFailed(true)} 
            />
          ) : (
            <div className="flex items-center gap-2">
              <svg viewBox="0 0 100 65" className="h-full w-auto fill-none" style={{ minWidth: '38px' }}>
                <path d="M 28 20 L 38 7 L 50 17 L 62 7 L 72 20 Z" stroke="#f97316" strokeWidth="3" strokeLinejoin="round" fill="none" />
                <path d="M 46 22 L 72 22 C 84 22, 92 30, 92 42 C 92 54, 82 62, 70 62 L 54 62 C 46 62, 40 56, 38 48" stroke="#f97316" strokeWidth="4" strokeLinecap="round" />
                <circle cx="78" cy="36" r="3.5" fill="#f97316" />
                <circle cx="86" cy="44" r="3.5" fill="#f97316" />
                <circle cx="70" cy="44" r="3.5" fill="#f97316" />
                <circle cx="78" cy="52" r="3.5" fill="#f97316" />
                <path d="M 16 38 L 48 24 L 56 36 L 24 50 Z" stroke="#f97316" strokeWidth="3.5" strokeLinejoin="round" />
                <path d="M 12 52 C 20 52, 28 42, 34 38 C 40 34, 46 36, 50 42 C 44 48, 38 58, 22 62" stroke="#ffffff" strokeWidth="3" strokeLinecap="round" />
              </svg>
              {showText && (
                <div className="flex flex-col leading-none">
                  <span className="text-[9px] tracking-widest text-slate-400 font-semibold uppercase">BY: RJR</span>
                  <div className="flex text-base font-black tracking-tight">
                    <span className="text-white">GAME</span>
                    <span className="text-amber-500 ml-1">MASTER</span>
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      );
    };

    // --- DEFAULT PERFUME INVENTORY ---
    const DEFAULT_ROUNDS = [
      {
        id: "item-1",
        name: "1 Million Elixir",
        option1: "Rabanne",
        option2: "Paco Rabanne",
        guessImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%23111827'/><rect x='80' y='50' width='140' height='200' rx='16' fill='%23d97706'/><text x='150' y='145' fill='white' font-family='sans-serif' font-size='18' font-weight='900' text-anchor='middle'>1 MILLION</text><text x='150' y='175' fill='%23fef3c7' font-family='sans-serif' font-size='12' font-weight='700' text-anchor='middle'>ELIXIR</text></svg>",
        revealImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%230b0f17'/><rect x='70' y='35' width='160' height='230' rx='18' fill='%23b45309'/><polygon points='150,75 190,140 110,140' fill='%23fef3c7'/><text x='150' y='180' fill='white' font-family='sans-serif' font-size='18' font-weight='900' text-anchor='middle'>1 MILLION</text><text x='150' y='205' fill='%23fde68a' font-family='sans-serif' font-size='11' font-weight='700' text-anchor='middle'>ELIXIR</text></svg>"
      },
      {
        id: "item-2",
        name: "Prada Paradoxe",
        option1: "Prada",
        option2: "Prada Milano",
        guessImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%23111827'/><polygon points='150,50 260,230 40,230' fill='%23fb7185'/><text x='150' y='160' fill='white' font-family='sans-serif' font-size='20' font-weight='900' text-anchor='middle' letter-spacing='3'>PRADA</text></svg>",
        revealImage: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 300 300'><rect width='300' height='300' fill='%230b0f17'/><polygon points='150,45 270,240 30,240' fill='%23f43f5e'/><rect x='135' y='22' width='30' height='20' fill='%231f2937' rx='3'/><text x='150' y='160' fill='white' font-family='sans-serif' font-size='22' font-weight='900' text-anchor='middle' letter-spacing='4'>PRADA</text><text x='150' y='190' fill='%23ffe4e6' font-family='sans-serif' font-size='11' font-weight='700' text-anchor='middle' letter-spacing='2'>PARADOXE</text></svg>"
      }
    ];

    function App() {
      const urlParams = new URLSearchParams(window.location.search);
      const urlRole = urlParams.get('role');
      const urlRoom = urlParams.get('room') || 'PERFUME';

      // Current view & room settings
      const [role, setRole] = useState(urlRole === 'contestant' ? 'contestant' : 'gm');
      const [roomCode] = useState(urlRoom);
      const [gmPasscode, setGmPasscode] = useState('');
      const [gmAuthenticated, setGmAuthenticated] = useState(false);
      const [activeTab, setActiveTab] = useState('arena'); // 'arena' | 'items'

      // Contestant local state
      const [playerName, setPlayerName] = useState(() => localStorage.getItem('perfume_player_name') || '');
      const [inputName, setInputName] = useState('');
      const [contestantGuess, setContestantGuess] = useState('');
      const [hasSubmitted, setHasSubmitted] = useState(false);
      const [netStatus, setNetStatus] = useState('connecting');

      // Perfume Inventory List
      const [rounds, setRounds] = useState(() => {
        try {
          const saved = localStorage.getItem('perfume_custom_rounds');
          return saved ? JSON.parse(saved) : DEFAULT_ROUNDS;
        } catch {
          return DEFAULT_ROUNDS;
        }
      });

      // --- CRITICAL PRADA FIX: ALWAYS START IN 'waiting' STATUS ---
      const [gameState, setGameState] = useState({
        status: 'waiting', // Enforced: never starts on 'revealed'
        roundIndex: 0,
        timer: 10,
        endTime: null,
        players: []
      });

      const [timeLeft, setTimeLeft] = useState(10);
      const [soundMuted, setSoundMuted] = useState(false);
      const [showShareModal, setShowShareModal] = useState(false);

      // Refs
      const mqttClientRef = useRef(null);
      const gameStateRef = useRef(gameState);
      gameStateRef.current = gameState;
      const roleRef = useRef(role);
      roleRef.current = role;

      // Clean out any stale 'revealed' cache on load
      useEffect(() => {
        try {
          localStorage.removeItem('perfume_game_state');
        } catch(e) {}
      }, []);

      useEffect(() => {
        sounds.muted = soundMuted;
      }, [soundMuted]);

      // --- MQTT SYNCHRONIZATION ---
      useEffect(() => {
        const topic = `giv-perfume-game-room/${roomCode}`;
        const clientId = `client_${Math.random().toString(16).substr(2, 8)}`;
        
        const client = new window.Paho.MQTT.Client('broker.hivemq.com', 8884, '/mqtt', clientId);
        mqttClientRef.current = client;

        client.onConnectionLost = () => {
          setNetStatus('connecting');
          setTimeout(() => {
            try { client.connect(connectOptions); } catch(e){}
          }, 3000);
        };

        client.onMessageArrived = (message) => {
          try {
            const data = JSON.parse(message.payloadString);
            if (data.senderId === clientId) return;

            if (data.type === 'STATE_UPDATE') {
              setGameState(prev => {
                if (prev.status === 'waiting' && data.state.status === 'guessing') {
                  sounds.playTick();
                  setHasSubmitted(false);
                  setContestantGuess('');
                }
                if (data.state.status === 'revealed' && prev.status !== 'revealed') {
                  sounds.playReveal();
                }
                return { ...prev, ...data.state };
              });
            } else if (data.type === 'PLAYER_JOIN') {
              if (roleRef.current === 'gm') {
                setGameState(prev => {
                  const exists = prev.players.find(p => p.id === data.player.id || p.name.toLowerCase() === data.player.name.toLowerCase());
                  let newPlayers;
                  if (exists) {
                    newPlayers = prev.players.map(p => (p.id === data.player.id || p.name.toLowerCase() === data.player.name.toLowerCase()) ? { ...p, id: data.player.id } : p);
                  } else {
                    newPlayers = [...prev.players, { ...data.player, score: 0, currentGuess: '', isCorrect: null }];
                  }
                  const updated = { ...prev, players: newPlayers };
                  broadcastState(updated);
                  return updated;
                });
              }
            } else if (data.type === 'PLAYER_SUBMIT') {
              if (roleRef.current === 'gm') {
                setGameState(prev => {
                  const updatedPlayers = prev.players.map(p => {
                    if (p.name.toLowerCase() === data.playerName.toLowerCase()) {
                      return { ...p, currentGuess: data.guess };
                    }
                    return p;
                  });
                  const updated = { ...prev, players: updatedPlayers };
                  broadcastState(updated);
                  return updated;
                });
              }
            } else if (data.type === 'GAME_RESET') {
              localStorage.removeItem('perfume_player_name');
              setPlayerName('');
              setContestantGuess('');
              setHasSubmitted(false);
              setGameState({
                status: 'waiting',
                roundIndex: 0,
                timer: 10,
                endTime: null,
                players: []
              });
            }
          } catch (err) {}
        };

        const connectOptions = {
          useSSL: true,
          timeout: 5,
          keepAliveInterval: 30,
          cleanSession: true,
          onSuccess: () => {
            setNetStatus('live');
            client.subscribe(topic, { qos: 0 });
            const currentName = localStorage.getItem('perfume_player_name');
            if (currentName) {
              publishMessage({
                type: 'PLAYER_JOIN',
                player: { id: clientId, name: currentName }
              });
            }
          },
          onFailure: () => {
            setNetStatus('offline');
          }
        };

        try {
          client.connect(connectOptions);
        } catch(e) {
          setNetStatus('offline');
        }

        return () => {
          try { client.disconnect(); } catch(e){}
        };
      }, [roomCode]);

      const publishMessage = (payload) => {
        if (mqttClientRef.current && mqttClientRef.current.isConnected()) {
          const message = new window.Paho.MQTT.Message(JSON.stringify({
            ...payload,
            senderId: mqttClientRef.current.clientId
          }));
          message.destinationName = `giv-perfume-game-room/${roomCode}`;
          message.retained = false;
          mqttClientRef.current.send(message);
        }
      };

      const broadcastState = (newState) => {
        publishMessage({
          type: 'STATE_UPDATE',
          state: newState
        });
      };

      // Periodic GM state sync
      useEffect(() => {
        if (role !== 'gm') return;
        const interval = setInterval(() => {
          broadcastState(gameStateRef.current);
        }, 3000);
        return () => clearInterval(interval);
      }, [role]);

      // Timer countdown effect
      useEffect(() => {
        let timerId;
        if (gameState.status === 'guessing' && gameState.endTime) {
          timerId = setInterval(() => {
            const diff = Math.max(0, Math.ceil((gameState.endTime - Date.now()) / 1000));
            setTimeLeft(diff);
            
            if (diff <= 3 && diff > 0) {
              sounds.playUrgentTick();
            } else if (diff > 3) {
              sounds.playTick();
            }

            if (diff <= 0) {
              clearInterval(timerId);
              sounds.playBuzzer();
              if (roleRef.current === 'gm') {
                handleRevealAnswer();
              }
            }
          }, 250);
        } else {
          setTimeLeft(10);
        }
        return () => clearInterval(timerId);
      }, [gameState.status, gameState.endTime]);

      const currentRound = rounds[gameState.roundIndex] || rounds[0] || DEFAULT_ROUNDS[0];

      // --- GM ACTION HANDLERS ---
      const handleStartTimer = () => {
        sounds.init();
        sounds.playTick();
        const duration = 10;
        const endTime = Date.now() + duration * 1000;
        
        const resetPlayers = gameState.players.map(p => ({
          ...p,
          currentGuess: '',
          isCorrect: null
        }));

        const next = {
          ...gameState,
          status: 'guessing',
          timer: duration,
          endTime: endTime,
          players: resetPlayers
        };
        setGameState(next);
        broadcastState(next);
      };

      const handleRevealAnswer = () => {
        sounds.playReveal();

        const opt1 = (currentRound.option1 || '').trim().toLowerCase();
        const opt2 = (currentRound.option2 || '').trim().toLowerCase();
        const allowOpt2 = opt2 && opt2 !== 'n/a' && opt2 !== 'na';

        const evaluatedPlayers = gameState.players.map(player => {
          const guess = (player.currentGuess || '').trim().toLowerCase();
          let isCorrect = false;
          if (guess.length > 0) {
            if (guess === opt1 || (allowOpt2 && guess === opt2)) {
              isCorrect = true;
            } else if (opt1.includes(guess) && guess.length >= 3) {
              isCorrect = true;
            }
          }
          return {
            ...player,
            isCorrect: isCorrect,
            score: isCorrect ? player.score + 1 : player.score
          };
        });

        const next = {
          ...gameState,
          status: 'revealed',
          players: evaluatedPlayers
        };
        setGameState(next);
        broadcastState(next);
      };

      const handleNextRound = () => {
        const nextIndex = (gameState.roundIndex + 1) % rounds.length;
        const next = {
          ...gameState,
          status: 'waiting', // Return everyone cleanly to waiting lobby
          roundIndex: nextIndex,
          timer: 10,
          endTime: null
        };
        setGameState(next);
        broadcastState(next);
      };

      const handleRestartGame = () => {
        if (!confirm("Reset all scores and return contestants to home screen?")) return;
        const next = {
          status: 'waiting',
          roundIndex: 0,
          timer: 10,
          endTime: null,
          players: []
        };
        setGameState(next);
        publishMessage({ type: 'GAME_RESET' });
        broadcastState(next);
      };

      const handleScoreAdjust = (name, delta) => {
        setGameState(prev => {
          const updated = {
            ...prev,
            players: prev.players.map(p => p.name === name ? { ...p, score: Math.max(0, p.score + delta) } : p)
          };
          broadcastState(updated);
          return updated;
        });
      };

      // --- CONTESTANT HANDLERS ---
      const handleRegisterName = (e) => {
        e.preventDefault();
        const trimmed = inputName.trim();
        if (!trimmed) return;
        localStorage.setItem('perfume_player_name', trimmed);
        setPlayerName(trimmed);
        publishMessage({
          type: 'PLAYER_JOIN',
          player: { id: `player_${Date.now()}`, name: trimmed }
        });
      };

      const handleSubmitGuess = (e) => {
        e.preventDefault();
        if (!contestantGuess.trim() || hasSubmitted) return;
        sounds.playTick();
        setHasSubmitted(true);
        publishMessage({
          type: 'PLAYER_SUBMIT',
          playerName: playerName,
          guess: contestantGuess.trim()
        });
      };

      const anonymousLeader = useMemo(() => {
        if (!gameState.players || gameState.players.length === 0) return "0 pts";
        const sorted = [...gameState.players].sort((a,b) => b.score - a.score);
        return sorted[0].score > 0 ? `Player No.1 (${sorted[0].score}p)` : "0 pts";
      }, [gameState.players]);

      const myPlayerData = useMemo(() => {
        return gameState.players.find(p => p.name.toLowerCase() === playerName.toLowerCase()) || { score: 0 };
      }, [gameState.players, playerName]);

      // --- CONTESTANT SCREEN RENDER ---
      if (role === 'contestant') {
        if (!playerName) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4 bg-[#0b0f17]">
              <div className="w-full max-w-sm bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl text-center space-y-6">
                <div className="flex justify-center">
                  <OfficialLogo className="h-12" />
                </div>
                <div>
                  <h1 className="text-xl font-bold text-white tracking-tight">Join Perfume Game</h1>
                  <p className="text-slate-400 text-xs mt-1">Room: <span className="text-amber-400 font-mono font-bold">{roomCode}</span></p>
                </div>
                <form onSubmit={handleRegisterName} className="space-y-4">
                  <input
                    type="text"
                    required
                    placeholder="Enter your nickname..."
                    value={inputName}
                    onChange={(e) => setInputName(e.target.value)}
                    className="w-full px-4 py-3 bg-slate-950 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-amber-500 text-center font-bold text-base"
                  />
                  <button
                    type="submit"
                    className="w-full py-3.5 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 text-slate-950 font-black rounded-xl shadow-lg transition active:scale-95"
                  >
                    Enter Game Arena ➔
                  </button>
                </form>
                <div className="pt-2">
                  <button onClick={() => setRole('gm')} className="text-xs text-slate-500 hover:text-slate-300 underline">
                    Switch to Game Master
                  </button>
                </div>
              </div>
            </div>
          );
        }

        const ContestantHeader = () => (
          <header className="px-4 py-3 bg-slate-900/90 backdrop-blur border-b border-slate-800 flex items-center justify-between sticky top-0 z-30">
            <div className="flex items-center gap-2">
              <OfficialLogo className="h-7" showText={false} />
              <div>
                <div className="flex items-center gap-1.5 leading-none">
                  <span className="font-bold text-xs text-slate-400 uppercase">CONTESTANT</span>
                  <span className={`inline-block w-2 h-2 rounded-full ${netStatus === 'live' ? 'bg-emerald-400' : 'bg-amber-400 animate-ping'}`} />
                </div>
                <div className="font-bold text-sm text-white flex items-center gap-1 mt-0.5">
                  {playerName}
                  <button onClick={() => { setPlayerName(''); localStorage.removeItem('perfume_player_name'); }} className="text-[10px] text-slate-400 font-normal hover:text-white underline">
                    (Edit)
                  </button>
                </div>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <div className="bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-300">
                <span className="text-[10px] text-slate-400 block uppercase leading-none">Leader</span>
                <span className="text-amber-400 font-bold">{anonymousLeader}</span>
              </div>
              <div className="bg-slate-800 border border-slate-700 text-amber-400 px-2.5 py-1 rounded-lg text-xs font-black flex items-center gap-1">
                <span>🏆</span>
                <span>{myPlayerData.score}</span>
              </div>
            </div>
          </header>
        );

        // 1. WAITING LOBBY (Always shown before Game Master clicks Start)
        if (gameState.status === 'waiting') {
          return (
            <div className="min-h-screen flex flex-col bg-[#0b0f17]">
              <ContestantHeader />
              <main className="flex-1 max-w-md w-full mx-auto p-4 flex flex-col items-center justify-center text-center space-y-6">
                
                <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-500/10 border border-amber-500/30 text-amber-400 text-xs font-bold animate-pulse-slow">
                  Waiting for Game Master to start...
                </div>

                <div className="py-2">
                  <OfficialLogo className="h-14 mx-auto justify-center" />

                            const reader = new FileReader();
                            reader.onload = () => {
                              const updated = rounds.map((r, i) => i === gameState.roundIndex ? { ...r, guessImage: reader.result } : r);
                              setRounds(updated);

                              const updated = rounds.map((r, i) => i === gameState.roundIndex ? { ...r, revealImage: reader.result } : r);
                              setRounds(updated);
                              localStorage.setItem('perfume_custom_rounds', JSON.stringify(updated));

                            reader.readAsDataURL(file);

                      />

                </div>

              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-xl space-y-3">
                <div className="flex items-center justify-between">

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-500 uppercase">
                        <th className="py-2 px-3">CONTESTANT</th>
                        <th className="py-2 px-3">THEIR GUESS</th>
                        <th className="py-2 px-3">AUTO RESULT</th>
                        <th className="py-2 px-3">TOTAL SCORE</th>

                    <tbody className="divide-y divide-slate-800/60 font-medium">

                          </td>
                        </tr>

                  </table>
                </div>

            </main>

                      revealImage: ""

                          onClick={() => {

                        value={item.option1}
                        onChange={(e) => {
                          const updated = rounds.map((r, i) => i === idx ? { ...r, option1: e.target.value } : r);
                          setRounds(updated);
                          localStorage.setItem('perfume_custom_rounds', JSON.stringify(updated));
                        }}
                        placeholder="Option 1 (Primary Brand)"
                        className="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-white text-xs font-bold"
                      />
                      <input
                        type="text"
                        value={item.option2}
                        onChange={(e) => {
                          const updated = rounds.map((r, i) => i === idx ? { ...r, option2: e.target.value } : r);
                          setRounds(updated);
                          localStorage.setItem('perfume_custom_rounds', JSON.stringify(updated));
                        }}
                        placeholder="Option 2 (Alternative / Optional)"
                        className="w-full px-3 py-1.5 bg-slate-950 border border-slate-800 rounded-lg text-amber-400 text-xs font-bold"
                      />
                    </div>
                  </div>
                ))}
              </div>
            </main>
          )}

          {/* SHARE MODAL */}
          {showShareModal && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-6 text-center space-y-4">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="text-sm font-bold text-white">Invite Contestants</h3>
                  <button onClick={() => setShowShareModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="bg-white p-3 rounded-xl inline-block mx-auto">
                  <img
                    src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(window.location.origin + window.location.pathname + '?role=contestant')}`}
                    alt="Contestant QR Code"
                    className="w-40 h-40"
                  />
                </div>
                <input
                  type="text"
                  readOnly
                  value={`${window.location.origin + window.location.pathname}?role=contestant`}
                  className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-slate-300 text-xs font-mono text-center"
                />
                <button
                  onClick={() => {
                    navigator.clipboard.writeText(`${window.location.origin + window.location.pathname}?role=contestant`);
                    alert('Copied link to clipboard!');
                  }}
                  className="w-full py-2 bg-amber-500 text-slate-950 font-bold rounded-xl text-xs hover:bg-amber-400"
                >
                  Copy Link
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
